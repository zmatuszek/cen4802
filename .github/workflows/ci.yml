name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run tests
        run: mvn -B -e -DskipTests=false verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/**
            **/target/surefire-reports/**

      - name: Upload build artifact (WAR)
        if: ${{ success() && hashFiles('target/ToDoTomcat.war') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ToDoTomcat-war-java-${{ matrix.java }}
          path: target/ToDoTomcat.war

      - name: Build Docker image
        if: ${{ matrix.java == '17' && success() && hashFiles('target/ToDoTomcat.war') != '' }}
        run: docker build -t todo-tomcat:${{ github.sha }} .

      - name: Save Docker image to tar
        if: ${{ matrix.java == '17' && success() }}
        run: docker save todo-tomcat:${{ github.sha }} -o todo-tomcat-image-${{ github.sha }}.tar

      - name: Upload Docker image artifact
        if: ${{ matrix.java == '17' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: todo-tomcat-image-${{ github.sha }}
          path: todo-tomcat-image-${{ github.sha }}.tar
          if-no-files-found: error

